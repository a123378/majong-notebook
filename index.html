<!DOCTYPE html>
<html lang="zh-TW" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>麻將紀錄 - 麻將記帳與戰績統計 PWA</title>
    
    <!-- PWA Settings -->
    <meta name="application-name" content="麻將紀錄" />
    <meta name="apple-mobile-web-app-title" content="麻將紀錄" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#064e3b" />
    <meta name="description" content="專業麻將記帳與戰績統計 PWA，支援離線優先記錄、自摸連莊台數即時計算、雲端跨裝置同步與深淺色模式。" />
    
    <!-- App Icons -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="alternate icon" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <link rel="manifest" href="./manifest.json" />

    <!-- Preload Fonts & Theme Script to prevent flash -->
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('mahjong_theme');
          var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (savedTheme === 'dark' || (!savedTheme && systemDark)) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased font-sans select-none min-h-screen overflow-x-hidden transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js', { scope: './' })
            .then(reg => {
              console.log('Mahjong PWA Service Worker Registered:', reg.scope);
            })
            .catch(err => {
              console.log('Service Worker registration skipped or failed:', err);
            });
        });
      }
    </script>
  </body>
</html>
